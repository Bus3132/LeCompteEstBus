<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102f63">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Comptage Bus 31/32</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Doto:wght@700;900&family=Atkinson+Hyperlegible+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column, sticky header with tabs + undo; each dosage is one row: ouvert / fermés / total, formula underneath */
:root{
  color-scheme:light;
  --bg:#f2f3f6; --surface:#ffffff; --ink:#15201e; --muted:#5c6b67; --line:#d5dddb;
  --accent:#174895; --accent-ink:#ffffff; --metha:#f39e07; --bupre:#174895; --oro:#77787b;
  --on-metha:#2a1a00; --on-bupre:#ffffff; --on-oro:#ffffff;
  --wa:#178a47; --wa-ink:#ffffff;
  --warn:#a84a12; --warn-bg:#fcefe3; --field:#f7f9f8;
  --sign:#102f63; --sign-edge:#0b2147; --led:#f9a51a; --led-dim:#1d4380;
  --f-led:"Doto", "Atkinson Hyperlegible Mono", ui-monospace, monospace;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
/* Girouette : le panneau de destination du bus */
.sign{display:flex;align-items:stretch;gap:10px;background:var(--sign);border:3px solid var(--sign-edge);border-radius:14px;padding:8px;color:var(--led);
  box-shadow:inset 0 0 0 1px #000, 0 2px 0 var(--sign-edge)}
.lineno{flex:0 0 auto;width:64px;display:grid;place-items:center;background:#ffffff;border-radius:9px;padding:4px}
.lineno img{width:56px;height:56px;display:block}
.led{flex:1;min-width:0;display:grid;align-content:center;gap:2px;
  background-image:radial-gradient(circle,var(--led-dim) 0.7px,transparent 1px);background-size:4px 4px;border-radius:6px;padding:4px 8px}
.led h1{margin:0;font-family:var(--f-led);font-weight:900;font-size:22px;line-height:1;letter-spacing:.04em;text-transform:uppercase;
  text-shadow:0 0 6px color-mix(in srgb,var(--led) 55%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.led .date{font-family:var(--f-led);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-direction:column;gap:6px;justify-content:center}
.iconbtn{border:1px solid var(--sign-edge);background:#1f2733;color:#e9edf3;border-radius:9px;height:36px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:17px;height:17px;flex:0 0 auto}
@media (max-width:420px){ .iconbtn span{display:none} .led h1{font-size:19px} }
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px 2px;font-size:14px;font-weight:700;display:flex;justify-content:center;align-items:center;gap:5px;min-width:0}
.tabs button[aria-selected="true"]{background:var(--g,var(--ink));color:var(--on-g,var(--bg))}
.tabs [data-tab="metha"]{--g:var(--metha);--on-g:var(--on-metha)} .tabs [data-tab="bupre"]{--g:var(--bupre);--on-g:var(--on-bupre)} .tabs [data-tab="oro"]{--g:var(--oro);--on-g:var(--on-oro)}
.tabs button[aria-selected="true"] .badge{background:color-mix(in srgb,var(--surface) 25%,transparent);color:inherit}
.badge{font-family:var(--f-num);font-size:11px;min-width:18px;padding:1px 5px;border-radius:99px;background:var(--warn-bg);color:var(--warn)}
.badge.done{background:transparent;color:inherit;opacity:.7}

.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-family:var(--f-num);min-height:16px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.status.ko{color:var(--warn);font-family:var(--f-body);font-weight:700}
.status.ko .dot{background:var(--warn)}
.resume{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px;display:grid;gap:8px}
.resume strong{font-size:15px}
.resume div{display:flex;gap:8px;flex-wrap:wrap}
.resume button{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
.item.here{box-shadow:inset 0 0 0 3px var(--accent)}
main{padding-top:14px}
.panel{display:grid;gap:12px}
.ghead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ghead h2{margin:0;font-size:24px;text-wrap:balance;display:flex;align-items:center;gap:10px}
.ghead h2 .pill{font-family:var(--f-led);font-weight:900;font-size:15px;background:var(--g,var(--ink));color:var(--on-g,var(--bg));border-radius:99px;padding:3px 10px 4px;letter-spacing:.04em}
.ghead p{margin:0;color:var(--muted);font-size:13px;font-family:var(--f-num);text-align:right}
.metha{--g:var(--metha);--on-g:var(--on-metha)} .bupre{--g:var(--bupre);--on-g:var(--on-bupre)} .oro{--g:var(--oro);--on-g:var(--on-oro)}
.panel.metha .ghead h2,.panel.bupre .ghead h2,.panel.oro .ghead h2{color:var(--ink)}

.notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.notice button{border:0;background:transparent;text-decoration:underline;font-weight:700;color:inherit;padding:4px;white-space:nowrap}

.list{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--g,var(--line));border-radius:14px;overflow:hidden}
.cols,.row{display:grid;grid-template-columns:minmax(72px,1.1fr) 1fr 1fr minmax(64px,.9fr);gap:8px;align-items:center;padding:0 12px}
.cols.c3,.row.c3{grid-template-columns:minmax(72px,1.1fr) 1fr minmax(72px,1fr)}
.cols{padding-block:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.cols span:last-child{text-align:right}
.item{border-bottom:1px solid var(--line);padding-block:10px 8px;display:grid;gap:6px}
.item:last-child{border-bottom:0}
.list .item{background:color-mix(in srgb,var(--dc,var(--g)) 16%,#ffffff)}
.list .item input.num:not(:focus),.list .item .chip:not([aria-pressed="true"]){background:#ffffff}
.dose{font-weight:700;font-size:17px;line-height:1.1;border-left:6px solid var(--dc,var(--g));padding-left:8px;display:flex;align-items:center;gap:7px}
.dose small{display:block}
.vial{width:15px;height:24px;flex:0 0 auto;color:var(--muted)}
.dose small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
input.num{width:100%;min-width:0;height:48px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;
  font-family:var(--f-num);font-size:22px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;padding:0 4px}
input.num::placeholder{color:var(--muted);opacity:.45;font-weight:400}
input.num:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
input.num.bad{border-color:var(--warn)}
.total{text-align:right;font-family:var(--f-num);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.total.empty{color:var(--muted);opacity:.5;font-weight:400}
.formula{padding:0 12px;font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.4em}
.formula .w{color:var(--warn);font-family:var(--f-body);font-weight:700}

/* Cartons fermés : pastilles 0-6 */
.chips{display:flex;align-items:center;gap:5px;padding:0 12px;flex-wrap:wrap}
.chips .clab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:100%;}
.chip{flex:1 1 0;min-width:34px;height:42px;border:1.5px solid var(--line);background:var(--field);border-radius:10px;
  font-family:var(--f-num);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.chip.more{font-size:15px;flex:1.2 1 0}
.chip[aria-pressed="true"]{background:var(--dc,var(--g));border-color:var(--dc,var(--g));color:#1b1b1b}
.chip:not([aria-pressed="true"]):hover{border-color:var(--dc,var(--g))}
.chips input.num{flex:0 0 76px;height:42px;font-size:18px}

details.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.settings summary{padding:12px 14px;cursor:pointer;font-weight:700;font-size:15px}
.setgrid{display:grid;grid-template-columns:1fr 92px 92px;gap:8px 10px;align-items:center;padding:0 14px 14px}
.setgrid .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.setgrid input.num{height:40px;font-size:18px}
.setgrid p{grid-column:1/-1;margin:4px 0 0;font-size:13px;color:var(--muted)}

.next{display:flex;justify-content:flex-end}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:13px 18px;font-weight:700;font-size:16px}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px}
a.wa{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--wa);color:var(--wa-ink);text-decoration:none;
  border-radius:14px;padding:16px 18px;font-weight:700;font-size:18px}
a.wa svg{width:24px;height:24px}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
td{font-family:var(--f-num);font-size:15px}
td:first-child{font-family:var(--f-body);font-weight:700}
td .vial{vertical-align:middle;margin-right:6px;width:12px;height:19px}
td.big{font-size:19px;font-weight:700}
tr.grp td{font-family:var(--f-body);font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding-top:14px;font-weight:700;border-bottom:2px solid var(--g);color:var(--g)}
tr:last-child td{border-bottom:0}
td .todo{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:99px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.confirm{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px;display:grid;gap:10px}
.confirm div{display:flex;gap:10px;flex-wrap:wrap}
.confirm .secondary{color:var(--ink)}
.confirm .danger{border:0;background:var(--warn);color:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700}
footer{margin-top:28px;text-align:center;font-size:12px;color:var(--muted);display:grid;gap:6px;justify-items:center}
.road{width:100%;height:6px;background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 30px);border-radius:3px}
textarea.copyfb{width:100%;height:180px;font-family:var(--f-num);font-size:13px;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Annuler</span>
        </button>
        <button class="iconbtn" id="redo" title="Rétablir" aria-label="Rétablir">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>Rétablir</span>
        </button>
      </div>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="metha">Métha <span class="badge" id="b-metha"></span></button>
      <button role="tab" data-tab="bupre">Bupré <span class="badge" id="b-bupre"></span></button>
      <button role="tab" data-tab="oro">Oro <span class="badge" id="b-oro"></span></button>
      <button role="tab" data-tab="res">Résultat</button>
    </div>
    <div class="status" id="status" aria-live="polite"><span class="dot"></span><span id="status-txt">Prêt</span></div>
  </header>
  <main id="main"></main>
  <footer><div class="road"></div><span>Le Bus 31/32 · Marseille</span></footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
// Couleurs des étiquettes des flacons de sirop Méthadone AP-HP
const METHA_COLORS={5:'#f3a6c4',10:'#f8b234',20:'#aab0b7',40:'#8fc740',60:'#3db5e6'};
function vial(c){ return c ? `<svg class="vial" viewBox="0 0 15 24" aria-hidden="true"><rect x="3.5" y="0.5" width="8" height="5" rx="1.2" fill="${c}"/><rect x="1" y="5.5" width="13" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2.6" y="12" width="9.8" height="10" rx="1.4" fill="${c}"/></svg>` : ''; }
const GROUPS = [
  { id:'metha', short:'MÉTHA', name:'Méthadone', unit:'flacons', container:'carton', openLbl:'Carton ouvert', closedLbl:'Cartons fermés', per:70, chips:6,
    items:[5,10,20,40,60].map(d=>({id:'m'+d, label:d+' mg', sub:'Méthadone', color:METHA_COLORS[d]})) },
  { id:'bupre', short:'BUPRÉ', name:'Buprénorphine', unit:'cp', container:'boîte', openLbl:'Nombre de comprimés', closedLbl:'Boîtes fermées', per:7,
    items:[0.4,1,2,4,6,8].map(d=>({id:'b'+String(d).replace('.','_'), label:String(d).replace('.',',')+' mg', sub:'Bupré'})) },
  { id:'oro', short:'ORO', name:'Orobupré', unit:'cp', container:'boîte', openLbl:'Nombre de comprimés', closedLbl:'Boîtes fermées', per:7,
    items:[2,8].map(d=>({id:'o'+d, label:d+' mg', sub:'Orobupré'})) }
];
const ORDER=['metha','bupre','oro','res'];
const ALL = GROUPS.flatMap(g=>g.items.map(it=>({...it, g})));

const KEY='csapa-comptage-v1', KEYSET='csapa-reglages-v1', KEYTAB='csapa-onglet';
function today(){ return new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function todayShort(){ return new Date().toLocaleDateString('fr-FR'); }
const KEYBAK=KEY+'-copie', KEYHIST='csapa-historique-v1';
function load(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(k,v){ try{ const t=JSON.stringify(v); localStorage.setItem(k,t); return localStorage.getItem(k)===t; }catch(e){ return false; } }
let saveOK=true, savedAt=null;

// Reprise : on lit la sauvegarde, et la copie de secours si elle est abîmée
let data = load(KEY,null);
if(!data || !data.counts) data = load(KEYBAK,null);
const resumed = !!(data && data.counts && Object.values(data.counts).some(c=>c && (c.open!==''||c.closed!=='')));
if(!data || !data.counts) data = { date: todayShort(), counts:{} };
let settings = load(KEYSET,{});
const DEFAULT_CAMION = {
  m5:20, m10:34, m20:20, m40:40, m60:40,
  b0_4:7, b1:7, b2:14, b4:14, b6:14, b8:14,
  o2:7, o8:7
};
ALL.forEach(it=>{
  if(!data.counts[it.id]) data.counts[it.id]={open:'',closed:''};
  if(!settings[it.id]) settings[it.id]={fixed:DEFAULT_CAMION[it.id] ?? 0, per:it.g.per};
});
let tab = load(KEYTAB,'metha'); if(!ORDER.includes(tab)) tab='metha';
const h0=load(KEYHIST,null);
let history=(h0&&h0.history)||[], future=(h0&&h0.future)||[];
let lastId=data.last||null, showResume=resumed;

const $=s=>document.querySelector(s);
const main=$('#main');
$('#date').textContent = new Date().toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}).replace(/\./g,'');

function n(v){ return v===''||v==null ? 0 : parseInt(v,10)||0; }
function filled(id){ const c=data.counts[id]; return c.open!=='' || c.closed!==''; }
function total(id){ const c=data.counts[id], s=settings[id]; return n(c.open) + n(c.closed)*s.per + n(s.fixed); }
function persist(){
  data.saved=Date.now(); data.last=lastId; data.tab=tab;
  const ok1=save(KEY,data), ok2=save(KEYBAK,data);
  save(KEYHIST,{history:history.slice(-60),future:future.slice(-60)});
  saveOK = ok1||ok2; if(saveOK) savedAt=new Date(data.saved);
  updateStatus(); updateChrome();
}
function hhmm(d){ return d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
function updateStatus(){
  const st=$('#status'), tx=$('#status-txt');
  st.classList.toggle('ko',!saveOK);
  tx.textContent = !saveOK ? 'Sauvegarde impossible sur ce navigateur : ne fermez pas la page avant d\'avoir envoyé le résultat.'
    : savedAt ? 'Enregistré automatiquement à '+hhmm(savedAt) : 'Enregistrement automatique activé';
}
function snap(){ return JSON.stringify(data.counts); }
function pushHistory(before){ if(before===snap()) return; history.push(before); if(history.length>200) history.shift(); future=[]; persist(); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }

function updateChrome(){
  $('#undo').disabled = history.length===0;
  $('#redo').disabled = future.length===0;
  GROUPS.forEach(g=>{
    const left = g.items.filter(it=>!filled(it.id)).length;
    const b=$('#b-'+g.id); b.textContent = left ? left : '✓'; b.classList.toggle('done', !left);
    b.title = left ? left+' dosage(s) à compter' : 'Tout est compté';
  });
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===tab));
}

const inputAttrs='inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" autocomplete="off"';

/* ---------- Saisie ---------- */
function renderGroup(g){
  const unset = g.items.filter(it=>!n(settings[it.id].fixed)).length;
  const nextTab = ORDER[ORDER.indexOf(g.id)+1];
  const nextLbl = {bupre:'Suivant : Bupré', oro:'Suivant : Orobupré', res:'Voir le résultat'}[nextTab];
  const c3 = g.chips ? 'c3' : '';
  main.innerHTML = `
  <section class="panel ${g.id}">
    ${resumeBanner()}
    <div class="ghead"><h2><span class="pill">${g.short}</span>${g.name}</h2><p>1 ${g.container} = ${g.per} ${g.unit}</p></div>
    ${unset===g.items.length ? `<div class="notice"><span>Le nombre « camion » n'est pas encore réglé (compté 0).</span><button data-open-settings>Régler</button></div>`:''}
    <div class="list">
      <div class="cols ${c3}"><span>Dosage</span><span>${g.openLbl}</span>${g.chips?'':`<span>${g.closedLbl}</span>`}<span>Reste</span></div>
      ${g.items.map(it=>`
      <div class="item" data-id="${it.id}"${it.color?` style="--dc:${it.color}"`:''}>
        <div class="row ${c3}">
          <div class="dose">${vial(it.color)}<span>${it.label}<small>${it.sub}</small></span></div>
          <input class="num" id="o-${it.id}" data-id="${it.id}" data-f="open" ${inputAttrs} placeholder="0" aria-label="${it.sub} ${it.label} — ${g.openLbl}, nombre de ${g.unit}">
          ${g.chips?'':`<input class="num" id="c-${it.id}" data-id="${it.id}" data-f="closed" ${inputAttrs} placeholder="0" aria-label="${it.sub} ${it.label} — ${g.closedLbl}">`}
          <div class="total" id="tot-${it.id}"></div>
        </div>
        ${g.chips?`
        <div class="chips" role="group" aria-label="${it.label} — ${g.closedLbl}">
          <span class="clab">${g.closedLbl}</span>
          ${Array.from({length:g.chips+1},(_,k)=>`<button class="chip" data-chip="${k}" data-id="${it.id}" aria-pressed="false">${k}</button>`).join('')}
          <button class="chip more" data-more data-id="${it.id}" aria-pressed="false">${g.chips+1}+</button>
          <input class="num" id="c-${it.id}" data-id="${it.id}" data-f="closed" ${inputAttrs} placeholder="${g.chips+1}" aria-label="${it.label} — ${g.closedLbl}, plus de ${g.chips}" hidden>
        </div>`:''}
        <div class="formula" id="f-${it.id}"></div>
      </div>`).join('')}
    </div>
    <details class="settings" id="settings">
      <summary>Réglages : camion et contenance</summary>
      <div class="setgrid">
        <span class="h">Dosage</span><span class="h">Camion</span><span class="h">Par ${g.container}</span>
        ${g.items.map(it=>`
          <span>${it.label}</span>
          <input class="num" id="sf-${it.id}" data-sid="${it.id}" data-sf="fixed" inputmode="numeric" pattern="[0-9]*" value="${settings[it.id].fixed||''}" placeholder="0" aria-label="${it.label} camion">
          <input class="num" id="sp-${it.id}" data-sid="${it.id}" data-sf="per" inputmode="numeric" pattern="[0-9]*" value="${settings[it.id].per}" aria-label="${it.label} par ${g.container}">
        `).join('')}
        <p>Ces chiffres sont gardés sur cet appareil d'un jour à l'autre. Le nombre camion est ajouté au total de chaque dosage.</p>
      </div>
    </details>
    <div class="next"><button class="primary" data-goto="${nextTab}">${nextLbl} →</button></div>
  </section>`;
  g.items.forEach(it=>{ $('#o-'+it.id).value=data.counts[it.id].open; $('#c-'+it.id).value=data.counts[it.id].closed; syncChips(it.id); refreshRow(it.id); });
}

function syncChips(id){
  const it=ALL.find(x=>x.id===id), g=it.g; if(!g.chips) return;
  const item=main.querySelector(`.item[data-id="${id}"]`); if(!item) return;
  const v=data.counts[id].closed, big = v!=='' && n(v)>g.chips;
  item.querySelectorAll('[data-chip]').forEach(b=>b.setAttribute('aria-pressed', v!=='' && n(v)===+b.dataset.chip));
  const more=item.querySelector('[data-more]'), inp=$('#c-'+id);
  if(big) inp.hidden=false;
  more.setAttribute('aria-pressed', !inp.hidden);
}

function refreshRow(id){
  const it=ALL.find(x=>x.id===id), g=it.g, c=data.counts[id], s=settings[id];
  const tot=$('#tot-'+id), f=$('#f-'+id); if(!tot) return;
  const o=$('#o-'+id);
  if(!filled(id)){ tot.textContent='—'; tot.classList.add('empty'); f.textContent=''; o&&o.classList.remove('bad'); return; }
  tot.textContent=total(id); tot.classList.remove('empty');
  let txt = `${n(c.open)} + ${n(c.closed)} × ${s.per} + ${n(s.fixed)} camion = ${total(id)}`;
  let warn='';
  if(g.chips && n(c.open)>=s.per) warn = ` <span class="w">${g.container} ouvert ≥ ${s.per} : à vérifier</span>`;
  else if(g.chips && c.open!=='' && c.closed==='') warn = ` <span class="w">${g.closedLbl.toLowerCase()} ?</span>`;
  o&&o.classList.toggle('bad', !!g.chips && n(c.open)>=s.per);
  f.innerHTML = txt + warn;
}

/* ---------- Résultat ---------- */
function resultText(){
  let t=`🚌 *Le Bus 31/32 — Comptage du ${todayShort()}*\n`;
  GROUPS.forEach(g=>{
    t+=`\n*${g.name}* (${g.unit})\n`;
    g.items.forEach(it=>{ t+=`${it.label} : ${filled(it.id)?total(it.id):'non compté'}\n`; });
  });
  return t.trim();
}
const waIcon='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.2A9.8 9.8 0 0 0 3.6 17l-1.4 4.8 4.9-1.3A9.8 9.8 0 1 0 12 2.2Zm0 17.8a8 8 0 0 1-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1 1 12 20Zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8.9c-.1.2-.3.2-.5.1a6.6 6.6 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.6.3 2.7 2.7 0 0 0-.9 2c0 1.2.9 2.3 1 2.5.1.2 1.7 2.6 4.2 3.7 1.6.7 2.2.7 3 .6.5-.1 1.4-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.6-.5Z"/></svg>';

function renderResult(){
  const missing = ALL.filter(it=>!filled(it.id)).length;
  main.innerHTML = `
  <section class="panel">
    ${resumeBanner()}<div class="ghead"><h2><span class="pill">TOTAL</span>Ce qui reste</h2><p>${todayShort()}</p></div>
    ${missing?`<div class="notice"><span>${missing} dosage(s) pas encore compté(s).</span></div>`:''}
    <a class="wa" href="https://wa.me/?text=${encodeURIComponent(resultText())}" target="_blank" rel="noopener">${waIcon}Envoyer sur WhatsApp</a>
    <div class="tablewrap"><table>
      <thead><tr><th>Dosage</th><th>À l'unité</th><th>Fermés</th><th>Camion</th><th>Reste</th></tr></thead>
      ${GROUPS.map(g=>`<tbody class="${g.id}">
        <tr class="grp"><td colspan="5">${g.name} · ${g.unit}</td></tr>
        ${g.items.map(it=>{ const c=data.counts[it.id], s=settings[it.id];
          return filled(it.id)
          ? `<tr><td>${vial(it.color)}${it.label}</td><td>${n(c.open)}</td><td>${n(c.closed)} × ${s.per}</td><td>${n(s.fixed)}</td><td class="big">${total(it.id)}</td></tr>`
          : `<tr><td>${vial(it.color)}${it.label}</td><td colspan="4" style="text-align:right"><span class="todo">à compter</span></td></tr>`;
        }).join('')}
      </tbody>`).join('')}
    </table></div>
    <div class="actions">
      <button class="secondary" id="copy">Copier le texte</button>
      <button class="secondary" id="reset">Nouveau comptage</button>
    </div>
    <div id="slot"></div>
  </section>`;
}

function itemName(id){ const it=ALL.find(x=>x.id===id); return it ? it.sub+' '+it.label : ''; }
function resumeBanner(){
  if(!showResume) return '';
  const when = data.saved ? new Date(data.saved) : null;
  const sameDay = data.date===todayShort();
  const whenTxt = when ? (sameDay ? 'à '+when.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : 'le '+data.date) : '';
  const left = ALL.filter(it=>!filled(it.id)).length;
  return `<div class="resume" role="status">
    <strong>Comptage repris là où vous l'aviez laissé</strong>
    <span>Dernière saisie ${whenTxt}${lastId?' : '+itemName(lastId):''}. ${left?left+' dosage(s) restent à compter.':'Tout est compté.'}</span>
    ${sameDay?'':'<span><b>Attention, ce comptage date d\'un autre jour.</b></span>'}
    <div><button data-resume-ok>Continuer</button>${sameDay?'':'<button data-resume-new>Nouveau comptage</button>'}</div>
  </div>`;
}
function markHere(){
  main.querySelectorAll('.item.here').forEach(x=>x.classList.remove('here'));
  if(lastId){ const el=main.querySelector(`.item[data-id="${lastId}"]`); if(el) el.classList.add('here'); }
}
function render(){
  if(tab==='res') renderResult(); else renderGroup(GROUPS.find(g=>g.id===tab));
  markHere(); updateChrome();
}

/* ---------- Événements ---------- */
let before=null;
main.addEventListener('focusin',e=>{ if(e.target.dataset.f){ before=snap(); setTimeout(()=>e.target.select&&e.target.select(),0); } });
main.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f){
    const clean=el.value.replace(/\D/g,'').slice(0,4);
    if(clean!==el.value) el.value=clean;
    data.counts[el.dataset.id][el.dataset.f]=clean;
    lastId=el.dataset.id; markHere();
    persist(); refreshRow(el.dataset.id);
    if(el.dataset.f==='closed') syncChips(el.dataset.id);
  } else if(el.dataset.sf){
    const clean=el.value.replace(/\D/g,'').slice(0,4); if(clean!==el.value) el.value=clean;
    const s=settings[el.dataset.sid];
    if(el.dataset.sf==='per'){ if(n(clean)>0) s.per=n(clean); } else s.fixed=n(clean);
    if(!save(KEYSET,settings)){ saveOK=false; updateStatus(); } refreshRow(el.dataset.sid);
  }
});
main.addEventListener('focusout',e=>{ if(e.target.dataset.f && before!==null){ pushHistory(before); before=null; } });
main.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.matches('input.num')){
    e.preventDefault();
    const ins=[...main.querySelectorAll(e.target.dataset.f?'input[data-f]':'input[data-sf]')].filter(x=>!x.hidden);
    const i=ins.indexOf(e.target);
    if(ins[i+1]) ins[i+1].focus(); else e.target.blur();
  }
});
main.addEventListener('click',e=>{
  const chip=e.target.closest('[data-chip]');
  if(chip){
    const id=chip.dataset.id, b=snap();
    data.counts[id].closed=chip.dataset.chip; lastId=id; markHere();
    const inp=$('#c-'+id); inp.value=chip.dataset.chip; inp.hidden=true;
    persist(); pushHistory(b); syncChips(id); refreshRow(id);
    // passe au dosage suivant
    const items=[...main.querySelectorAll('.item')]; const nx=items[items.findIndex(x=>x.dataset.id===id)+1];
    if(nx){ const o=nx.querySelector('input[data-f="open"]'); if(o && o.value==='') o.focus({preventScroll:false}); }
    return;
  }
  if(e.target.closest('[data-resume-ok]')){ showResume=false; render(); return; }
  if(e.target.closest('[data-resume-new]')){ showResume=false; tab='res'; render(); $('#reset').click(); return; }
  const more=e.target.closest('[data-more]');
  if(more){ const inp=$('#c-'+more.dataset.id); inp.hidden=false; more.setAttribute('aria-pressed','true'); inp.focus(); return; }
  const go=e.target.closest('[data-goto]'); if(go){ setTab(go.dataset.goto); return; }
  if(e.target.closest('[data-open-settings]')){ const d=$('#settings'); d.open=true; d.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(e.target.id==='copy'){ copyResult(); return; }
  if(e.target.id==='reset'){
    $('#slot').innerHTML=`<div class="confirm"><strong>Effacer toutes les saisies du jour ?</strong><span>Les réglages camion sont gardés. Vous pourrez encore faire « Annuler ».</span><div><button class="danger" id="reset-yes">Effacer</button><button class="secondary" id="reset-no">Garder</button></div></div>`;
    return;
  }
  if(e.target.id==='reset-no'){ $('#slot').innerHTML=''; return; }
  if(e.target.id==='reset-yes'){
    const b=snap(); ALL.forEach(it=>data.counts[it.id]={open:'',closed:''}); data.date=todayShort();
    lastId=null; showResume=false; persist(); pushHistory(b); setTab('metha'); toast('Nouveau comptage prêt'); return;
  }
});

function copyResult(){
  const txt=resultText().replace(/\*/g,'');
  const fallback=()=>{ $('#slot').innerHTML=`<textarea class="copyfb" readonly></textarea>`; const ta=$('#slot textarea'); ta.value=txt; ta.focus(); ta.select(); toast('Texte sélectionné : copiez-le'); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast('Résultat copié'),fallback); }catch(err){ fallback(); }
}

function setTab(t){ tab=t; save(KEYTAB,t); persist(); render(); window.scrollTo({top:0}); }
document.querySelector('.tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b) setTab(b.dataset.tab); });

function restore(json){ data.counts=JSON.parse(json); persist(); render(); }
function undo(){ const a=document.activeElement; if(a && a.dataset && a.dataset.f) a.blur();
  if(!history.length) return; future.push(snap()); restore(history.pop()); toast('Saisie annulée'); }
function redo(){ if(!future.length) return; history.push(snap()); restore(future.pop()); toast('Saisie rétablie'); }
$('#undo').addEventListener('click',undo);
$('#redo').addEventListener('click',redo);
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if((e.ctrlKey||e.metaKey) && (e.key.toLowerCase()==='y' || (e.shiftKey && e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); }
});

// Sauvegarde de sécurité : toutes les 10 s, quand l'appli passe en arrière-plan, et en cas d'erreur
setInterval(persist,10000);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') persist(); });
window.addEventListener('pagehide',persist);
window.addEventListener('error',()=>{ try{ persist(); }catch(e){} });

if(data.tab && ORDER.includes(data.tab)) tab=data.tab;
render();
persist();
// on se replace sur la dernière ligne saisie
if(showResume && lastId){ const el=main.querySelector(`.item[data-id="${lastId}"]`); if(el) setTimeout(()=>el.scrollIntoView({block:'center'}),50); }
})();
</script>

</body>
</html>
